[project]
name = "stream-anything-server"
version = "0.0.1"
description = "Shares video folders from your computer with the Stream Anything app over your home network"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    # mDNS advertisement, so the Stream Anything app can find the server without an IP address.
    "zeroconf>=0.136,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
]

[project.scripts]
stream-anything-server = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
